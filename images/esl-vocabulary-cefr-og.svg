<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1560"/>
      <stop offset="60%" stop-color="#3C3489"/>
      <stop offset="100%" stop-color="#4A3FD4"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="24" ry="24" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="24" ry="24" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <ellipse cx="1060" cy="110" rx="280" ry="200" fill="#7c6ff7" opacity="0.16" filter="url(#glow)"/>
  <ellipse cx="150" cy="540" rx="220" ry="160" fill="#4A3FD4" opacity="0.20" filter="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="80" y="158" width="4" height="314" rx="2" fill="rgba(255,255,255,0.22)"/>

  <!-- Badge -->
  <rect x="96" y="152" width="200" height="30" rx="15" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <text x="196" y="172" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.88)" text-anchor="middle" letter-spacing="1.2">ESL VOCABULARY</text>

  <!-- Main headline -->
  <text x="96" y="256" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="400" fill="#ffffff" letter-spacing="-2">English Words</text>
  <text x="96" y="332" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="400" fill="#ffffff" letter-spacing="-2">by CEFR Level</text>
  <text x="96" y="408" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="400" fill="#c4bfff" letter-spacing="-2">A1 → C2</text>

  <!-- Subline -->
  <text x="96" y="462" font-family="DM Sans, system-ui, sans-serif" font-size="19" fill="rgba(255,255,255,0.58)">IPA · definitions · example sentences · free printable</text>

  <!-- Divider -->
  <line x1="96" y1="496" x2="460" y2="496" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Wordineer mark -->
  <rect x="96" y="512" width="24" height="24" rx="6" fill="#4A3FD4" stroke="rgba(255,255,255,0.38)" stroke-width="1.5"/>
  <text x="108" y="529" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">W</text>
  <text x="130" y="530" font-family="DM Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.70)">wordineer.com</text>

  <!-- Right: CEFR level cards stacked in 2 columns -->

  <!-- A1 -->
  <rect x="648" y="68" width="245" height="88" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="660" y="80" width="36" height="22" rx="6" fill="#1D9E75"/>
  <text x="678" y="96" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">A1</text>
  <text x="706" y="96" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Beginner</text>
  <text x="660" y="122" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">hello · eat · big</text>
  <text x="660" y="143" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">everyday survival words</text>

  <!-- A2 -->
  <rect x="907" y="68" width="245" height="88" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="919" y="80" width="36" height="22" rx="6" fill="#22c55e"/>
  <text x="937" y="96" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">A2</text>
  <text x="965" y="96" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Elementary</text>
  <text x="919" y="122" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">often · borrow · angry</text>
  <text x="919" y="143" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">simple conversations</text>

  <!-- B1 -->
  <rect x="648" y="174" width="245" height="88" rx="12" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="660" y="186" width="36" height="22" rx="6" fill="#185FA5"/>
  <text x="678" y="202" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">B1</text>
  <text x="706" y="202" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Intermediate</text>
  <text x="660" y="228" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">efficient · dispute</text>
  <text x="660" y="249" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">independent travel &amp; work</text>

  <!-- B2 -->
  <rect x="907" y="174" width="245" height="88" rx="12" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="919" y="186" width="36" height="22" rx="6" fill="#0284c7"/>
  <text x="937" y="202" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">B2</text>
  <text x="965" y="202" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Upper-inter.</text>
  <text x="919" y="228" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">inevitable · comply</text>
  <text x="919" y="249" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">IELTS / TOEFL level</text>

  <!-- C1 -->
  <rect x="648" y="280" width="245" height="88" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="660" y="292" width="36" height="22" rx="6" fill="#7c3aed"/>
  <text x="678" y="308" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">C1</text>
  <text x="706" y="308" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Advanced</text>
  <text x="660" y="334" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">nuance · proliferate</text>
  <text x="660" y="355" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">professional fluency</text>

  <!-- C2 -->
  <rect x="907" y="280" width="245" height="88" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="919" y="292" width="36" height="22" rx="6" fill="#b45309"/>
  <text x="937" y="308" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">C2</text>
  <text x="965" y="308" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Mastery</text>
  <text x="919" y="334" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">pellucid · recondite</text>
  <text x="919" y="355" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">near-native precision</text>

  <!-- Bottom stat bar -->
  <rect x="648" y="390" width="504" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- stat 1 -->
  <text x="730" y="414" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="730" y="436" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">CEFR levels</text>
  <!-- divider -->
  <line x1="796" y1="400" x2="796" y2="440" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- stat 2 -->
  <text x="870" y="414" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">IPA</text>
  <text x="870" y="436" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">pronunciation</text>
  <!-- divider -->
  <line x1="944" y1="400" x2="944" y2="440" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- stat 3 -->
  <text x="1020" y="414" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Free</text>
  <text x="1020" y="436" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">printable PDF</text>
  <!-- divider -->
  <line x1="1092" y1="400" x2="1092" y2="440" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- stat 4 -->
  <text x="1140" y="414" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="1140" y="436" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">no login</text>

  <!-- IPA sample strip -->
  <rect x="648" y="468" width="504" height="120" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="668" y="494" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="1">SAMPLE · B2</text>
  <text x="668" y="524" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#ffffff">inevitable</text>
  <text x="800" y="524" font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.40)">/ɪnˈɛvɪtəb(ə)l/</text>
  <text x="668" y="548" font-family="DM Sans, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">certain to happen; impossible to avoid</text>
  <text x="668" y="572" font-family="DM Sans, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" font-style="italic">"Change is inevitable in any growing organisation."</text>
</svg>
