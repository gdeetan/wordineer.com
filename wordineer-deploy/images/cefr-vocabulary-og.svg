<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1560"/>
      <stop offset="60%" stop-color="#3C3489"/>
      <stop offset="100%" stop-color="#4A3FD4"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="24" ry="24" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="24" ry="24" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <ellipse cx="1080" cy="100" rx="260" ry="190" fill="#7c6ff7" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="140" cy="550" rx="200" ry="150" fill="#4A3FD4" opacity="0.20" filter="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="80" y="158" width="4" height="314" rx="2" fill="rgba(255,255,255,0.22)"/>

