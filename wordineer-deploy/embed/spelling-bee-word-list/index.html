<style>

  body.is-worksheet .word-text { font-size: 1.3rem; }
  body.is-worksheet .word-item::after { content: ''; display: block; border-bottom: 1px solid #9ca3af; margin-top: 18px; width: 70%; }
}

/* ── Classroom Mode ── */
.classroom-btn { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2); border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s, color .15s; }
.classroom-btn:hover { border-color: var(--brand); color: var(--brand); }
.classroom-btn.is-on { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
body.is-classroom header, body.is-classroom nav, body.is-classroom .breadcrumb, body.is-classroom .hero, body.is-classroom .explainer, body.is-classroom .faq, body.is-classroom .who, body.is-classroom footer, body.is-classroom .ad, body.is-classroom [class*="ad-"], body.is-classroom .more-tools, body.is-classroom .saved-section { display: none !important; }
body.is-classroom .tool-wrap { max-width: 100%; border-radius: 0; box-shadow: none; }
body.is-classroom .results-col { min-height: 100vh; }
</style>

<script>
(function () {
  function he(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var SBT = {
    data: null,
    saved: JSON.parse(localStorage.getItem('sb-saved') || '[]'),

    load: function () {
      var self = this;
      if (self.data) return Promise.resolve(self.data);
      return fetch('/data/spelling-bee-words.json')
        .then(function (r) { return r.json(); })
        .then(function (d) { self.data = d; return d; });
    },

    filter: function (words) {
      var g      = document.getElementById('ctrl-grade').value;
      var d      = document.getElementById('ctrl-diff').value;
      var origin = document.getElementById('ctrl-origin').value;
      var syl    = document.getElementById('ctrl-syl').value;
      var count  = Math.min(50, Math.max(1, parseInt(document.getElementById('ctrl-count').value, 10) || 20));
      var result = words.slice();
      if (g !== 'all')      result = result.filter(function (w) { return w.grade === g; });
      if (d !== 'all')      result = result.filter(function (w) { return w.diff === d; });
      if (origin !== 'all') result = result.filter(function (w) { return w.origin === origin; });
      if (syl !== 'all')    result = result.filter(function (w) { return syl === '3' ? w.syl >= 3 : w.syl === parseInt(syl, 10); });
      for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = result[i]; result[i] = result[j]; result[j] = tmp;
      }
      return result.slice(0, count);
    },

    generate: function () {
      var self = this;
      self.load().then(function (words) {
        self.render(self.filter(words));
      }).catch(function () {
        var list = document.getElementById('sb-list');
        if (list) list.innerHTML = '<li class="sb-empty">Could not load word list. Please refresh and try again.</li>';
      });
    },

    render: function (words) {
      var list    = document.getElementById('sb-list');
      var countEl = document.getElementById('sb-count');
      var showDef = document.getElementById('ctrl-defs').checked;
      var saved   = this.saved;

      if (!words.length) {
        list.innerHTML = '<li class="sb-empty">No words match your filters. Try adjusting grade or difficulty.</li>';
        countEl.textContent = '0 words';
        return;
      }

      countEl.textContent = words.length + ' word' + (words.length !== 1 ? 's' : '');
      list.innerHTML = words.map(function (w) {
        var isSaved = saved.indexOf(w.w) !== -1;
        var esc = w.w.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return '<li class="word-item" data-word="' + he(w.w) + '" data-def="' + he(w.d) + '">' +
          '<div class="word-left">' +
          '<div class="word-text">' + he(w.w) + '</div>' +
          '<div class="word-badges">' +
          '<span class="sb-origin" data-o="' + he(w.origin) + '">' + he(w.origin) + '</span>' +
          '<span class="badge badge-meta">' + he(w.syl) + ' syl</span>' +
          '<span class="badge badge-meta">' + he(w.pos) + '</span>' +
          '</div>' +
          '<div class="word-def' + (showDef ? '' : ' hidden') + '">' + he(w.d) + '</div>' +
          '</div>' +
          '<div class="word-right">' +
          '<button class="icon-btn sb-copy-word" onclick="SBT.copyWord(\'' + esc + '\')" title="Copy word"><svg viewBox="0 0 14 14" fill="none"><rect x="1" y="4" width="9" height="9.5" rx="1.5" stroke="currentColor" stroke-width="1.1"/><path d="M4.5 4V2.5A1.5 1.5 0 016 1h5.5A1.5 1.5 0 0113 2.5v7a1.5 1.5 0 01-1.5 1.5H10" stroke="currentColor" stroke-width="1.1"/></svg></button>' +
          '<button class="icon-btn sb-save' + (isSaved ? ' saved' : '') + '" onclick="SBT.toggleSave(\'' + esc + '\')" title="Save word"><svg viewBox="0 0 16 16" fill="none"><path d="M8 13.5S2 9.5 2 5.5A3 3 0 018 4a3 3 0 016 1.5c0 4-6 8-6 8z" stroke="currentColor" stroke-width="1.3" fill="' + (isSaved ? '#E24B4A' : 'none') + '" stroke-linecap="round"/></svg></button>' +
          '</div>' +
          '</li>';
      }).join('');

      // Encode current list into URL for sharing
      var wordNames = words.map(function (w) { return w.w; });
      var shareUrl = new URL(window.location.href);
      shareUrl.searchParams.set('words', wordNames.join(','));
      history.replaceState(null, '', shareUrl.toString());
    },

    toggleSave: function (word) {
      var idx = this.saved.indexOf(word);
      if (idx === -1) this.saved.push(word);
      else this.saved.splice(idx, 1);
      localStorage.setItem('sb-saved', JSON.stringify(this.saved));
      this.renderSaved();
      var items = document.querySelectorAll('.word-item');
      for (var k = 0; k < items.length; k++) {
        if (items[k].dataset.word === word) {
          var btn = items[k].querySelector('.sb-save');
          if (btn) btn.classList.toggle('saved', this.saved.indexOf(word) !== -1);
          break;
        }
      }
    },

    renderSaved: function () {
      var container = document.getElementById('sb-saved-tags');
      var count = document.getElementById('sb-saved-count');
      count.textContent = '(' + this.saved.length + ')';
      if (!this.saved.length) {
        container.innerHTML = '<span class="saved-empty">Click the heart on any word to save it here</span>';
        return;
      }
      container.innerHTML = this.saved.map(function (w) {
        var esc = w.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return '<span class="saved-tag">' + he(w) +
          '<span class="saved-tag-remove" onclick="SBT.toggleSave(\'' + esc + '\')">&#215;</span></span>';
      }).join('');
    },

    copyAll: function () {
      var words = [].slice.call(document.querySelectorAll('#sb-list .word-text')).map(function (el) { return el.textContent; });
      if (navigator.clipboard) navigator.clipboard.writeText(words.join('\n'));
    },

    copySaved: function () {
      if (navigator.clipboard) navigator.clipboard.writeText(this.saved.join('\n'));
    },

    copyWord: function (word) {
      if (navigator.clipboard) navigator.clipboard.writeText(word);
    },

    shareList: function () {
      var url = window.location.href;
      var btn = document.getElementById('sb-share-btn');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          if (btn) { btn.textContent = '✓ Copied!'; setTimeout(function () { btn.textContent = 'Share List'; }, 2000); }
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        if (btn) { btn.textContent = '✓ Copied!'; setTimeout(function () { btn.textContent = 'Share List'; }, 2000); }
      }
    },

    toggleDefs: function () {
      var show = document.getElementById('ctrl-defs').checked;
      [].slice.call(document.querySelectorAll('.word-def')).forEach(function (el) {
        el.classList.toggle('hidden', !show);
      });
    },

    reset: function () {
      document.getElementById('ctrl-count').value  = '20';
      document.getElementById('ctrl-grade').value  = 'all';
      document.getElementById('ctrl-diff').value   = 'all';
      document.getElementById('ctrl-origin').value = 'all';
      document.getElementById('ctrl-syl').value    = 'all';
      document.getElementById('ctrl-defs').checked = true;
      [].slice.call(document.querySelectorAll('.word-def')).forEach(function (el) { el.classList.remove('hidden'); });
      var err = document.getElementById('count-error');
      if (err) err.classList.remove('show');
      document.getElementById('ctrl-count').classList.remove('input-error');
      this.generate();
    },

    init: function () {
      var self = this;
      self.renderSaved();

      document.getElementById('sb-gen-btn').addEventListener('click', function () { self.generate(); });
      document.getElementById('sb-reset-btn').addEventListener('click', function () { self.reset(); });
      document.getElementById('sb-copy-all').addEventListener('click', function () { self.copyAll(); });
      document.getElementById('sb-print-btn').addEventListener('click', function () { printWordList(false); });
      var worksheetBtn = document.getElementById('sb-worksheet-btn');
      if (worksheetBtn) worksheetBtn.addEventListener('click', function () { printWordList(true); });
      var shareBtn = document.getElementById('sb-share-btn');
      if (shareBtn) shareBtn.addEventListener('click', function () { self.shareList(); });
      document.getElementById('sb-copy-saved').addEventListener('click', function () { self.copySaved(); });
      document.getElementById('ctrl-defs').addEventListener('change', function () { self.toggleDefs(); });

      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space') return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'TEXTAREA') return;
        e.preventDefault();
        self.generate();
      });

      ['ctrl-grade', 'ctrl-diff', 'ctrl-origin', 'ctrl-syl'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', function () { self.generate(); });
      });
      var countEl = document.getElementById('ctrl-count');
      if (countEl) countEl.addEventListener('input', function () {
        var raw = parseInt(countEl.value, 10);
        var valid = !isNaN(raw) && raw >= 1 && raw <= 50;
        var err = document.getElementById('count-error');
        if (err) err.classList.toggle('show', !valid);
        countEl.classList.toggle('input-error', !valid);
        if (valid) self.generate();
      });

      var urlWords = new URLSearchParams(window.location.search).get('words');
      if (urlWords) {
        self.load().then(function (allWords) {
          var wanted = urlWords.split(',').map(function (s) { return s.trim().toLowerCase(); });
          var wordMap = {};
          allWords.forEach(function (w) { wordMap[w.w.toLowerCase()] = w; });
          var filtered = wanted.map(function (name) { return wordMap[name]; }).filter(Boolean);
          if (filtered.length) { self.render(filtered); return; }
          self.generate();
        }).catch(function () { self.generate(); });
      } else if (typeof requestIdleCallback !== 'undefined') {
        requestIdleCallback(function () { self.generate(); });
      } else {
        setTimeout(function () { self.generate(); }, 100);
      }
    }
  };

  window.SBT = SBT;
  SBT.init();

  /* ── Mobile more-options toggle ── */
  var moreToggle = document.getElementById('mobile-more-toggle');
  var advancedOpts = document.getElementById('advanced-options');
  if (moreToggle && advancedOpts) {
    moreToggle.addEventListener('click', function () {
      var isOpen = advancedOpts.classList.toggle('is-open');
      moreToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      moreToggle.textContent = isOpen ? 'Hide More Options' : 'Toggle More Options';
    });
  }

  /* ── FAQ accordion ── */
  document.querySelectorAll('.faq-item').forEach(function (item) {
    var q = item.querySelector('.faq-q');
    if (!q) return;
    q.addEventListener('click', function () {
      item.classList.toggle('open');
    });
  });

  // Classroom mode
  (function () {
    var btn = document.getElementById('sb-classroom-btn');
    function setClassroom(on) {
      document.body.classList.toggle('is-classroom', on);
      if (btn) {
        btn.classList.toggle('is-on', on);
        btn.textContent = on ? '✕ Exit Classroom' : '⊞ Classroom';
      }
      var url = new URL(window.location.href);
      if (on) url.searchParams.set('mode', 'classroom');
      else url.searchParams.delete('mode');
      history.replaceState(null, '', url.toString());
    }
    if (btn) btn.addEventListener('click', function () {
      setClassroom(!document.body.classList.contains('is-classroom'));
    });
    if (new URLSearchParams(window.location.search).get('mode') === 'classroom') {
      setClassroom(true);
    }
  }());

  function printWordList(worksheet) {
    var items = document.querySelectorAll('#sb-list .word-item');
    if (!items.length) { alert('Generate a word list first.'); return; }
    var titleEl = document.querySelector('.print-header-title');
    var listTitle = titleEl ? titleEl.textContent.trim() : 'Spelling Bee Word List';
    var pageUrl = window.location.hostname + window.location.pathname;
    var rows = [];
    items.forEach(function(item) {
      var wordEl  = item.querySelector('.word-text');
      var defEl   = item.querySelector('.word-def');
      var origEl  = item.querySelector('.sb-origin');
      var metas   = item.querySelectorAll('.badge-meta');
      rows.push({
        word:   wordEl ? wordEl.textContent.trim()  : '',
        def:    defEl  ? defEl.textContent.trim()   : '',
        origin: origEl ? origEl.textContent.trim()  : '',
        syl:    metas.length     ? metas[0].textContent.trim() : '',
        pos:    metas.length > 1 ? metas[1].textContent.trim() : ''
      });
    });
    var n = rows.length;
    var css, body;
    if (worksheet) {
      css = 'body{font-family:Arial,sans-serif;margin:.75in;color:#111;font-size:11pt}' +
            'h1{font-size:16pt;margin:0 0 3pt}' +
            '.meta{font-size:9pt;color:#666;margin:0 0 4pt}' +
            '.name-row{display:flex;gap:20pt;margin:14pt 0 22pt;font-size:10pt;align-items:flex-end}' +
            '.name-row label{font-size:9pt;color:#555;margin-right:4pt}' +
            '.name-row span{flex:1;border-bottom:1pt solid #aaa;min-width:80pt}' +
            'ol{padding:0;margin:0;list-style:none;counter-reset:w;display:grid;grid-template-columns:1fr 1fr;gap:0}' +
            'li{counter-increment:w;padding:10pt 8pt 6pt;border-bottom:.5pt solid #e5e7eb;page-break-inside:avoid}' +
            '.n{font-size:8pt;color:#9ca3af;font-weight:700}' +
            '.n::before{content:counter(w)". "}' +
            '.word{display:block;font-size:15pt;font-weight:700;margin:2pt 0 12pt}' +
            '.line{border-bottom:1pt solid #9ca3af;width:85%;display:block}' +
            '.foot{font-size:7.5pt;color:#aaa;margin-top:18pt;border-top:.5pt solid #e5e7eb;padding-top:8pt}' +
            '@media print{body{margin:.5in}}';
      body = '<h1>' + he(listTitle) + ' — Practice Worksheet</h1>' +
             '<p class="meta">' + n + ' word' + (n !== 1 ? 's' : '') + ' &nbsp;·&nbsp; wordineer.com</p>' +
             '<div class="name-row"><label>Name:</label><span>&nbsp;</span><label>Date:</label><span style="min-width:60pt">&nbsp;</span></div>' +
             '<ol>' + rows.map(function(r) {
               return '<li><span class="n"></span><span class="word">' + he(r.word) + '</span><span class="line"></span></li>';
             }).join('') + '</ol>' +
             '<p class="foot">Free spelling bee practice · ' + he(pageUrl) + '</p>';
    } else {
      css = 'body{font-family:Georgia,serif;margin:.75in;color:#111;font-size:11pt}' +
            'h1{font-size:18pt;margin:0 0 3pt}' +
            '.meta{font-size:9pt;color:#666;margin:0 0 0;padding-bottom:10pt;border-bottom:1pt solid #ddd}' +
            'ol{padding:0;margin:14pt 0 0;list-style:none;counter-reset:w}' +
            'li{counter-increment:w;padding:9pt 0;border-bottom:.5pt solid #e5e7eb;page-break-inside:avoid;display:flex;gap:10pt;align-items:baseline}' +
            'li:last-child{border-bottom:none}' +
            '.n{font-size:9pt;color:#9ca3af;font-weight:700;min-width:18pt;flex-shrink:0}' +
            '.n::before{content:counter(w)"."}' +
            '.body{flex:1}' +
            '.word{font-size:15pt;font-weight:700;letter-spacing:-.01em;display:block;margin-bottom:2pt}' +
            '.badges{display:flex;gap:5pt;margin-bottom:3pt;flex-wrap:wrap}' +
            '.badge{font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;background:#f3f4f6;padding:1pt 5pt;border-radius:3pt}' +
            '.def{font-size:9.5pt;color:#374151;line-height:1.5}' +
            '.foot{font-size:7.5pt;color:#aaa;margin-top:18pt;border-top:.5pt solid #e5e7eb;padding-top:8pt}' +
            '@media print{body{margin:.5in}}';
      body = '<h1>' + he(listTitle) + '</h1>' +
             '<p class="meta">' + n + ' word' + (n !== 1 ? 's' : '') + ' &nbsp;·&nbsp; ' + he(pageUrl) + '</p>' +
             '<ol>' + rows.map(function(r) {
               var badges = '';
               if (r.origin) badges += '<span class="badge">' + he(r.origin) + '</span>';
               if (r.syl)    badges += '<span class="badge">' + he(r.syl)    + '</span>';
               if (r.pos)    badges += '<span class="badge">' + he(r.pos)    + '</span>';
               return '<li><span class="n"></span><div class="body">' +
                 '<span class="word">' + he(r.word) + '</span>' +
                 (badges ? '<div class="badges">' + badges + '</div>' : '') +
                 (r.def  ? '<div class="def">'    + he(r.def)  + '</div>' : '') +
                 '</div></li>';
             }).join('') + '</ol>' +
             '<p class="foot">Free spelling bee practice at wordineer.com</p>';
    }
    var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + he(listTitle) + (worksheet ? ' — Worksheet' : '') + '</title><style>' + css + '</style></head><body>' + body + '</body></html>';
    var w = window.open('', '_blank', 'width=820,height=700');
    w.document.write(html);
    w.document.close();
    w.focus();
    w.print();
  }
}());
</script>
</body>
</html>
